name: tests

# Tests run on every push and on every pull request. None of them touches the
# network: the result depends only on the code.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install test tooling
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q
