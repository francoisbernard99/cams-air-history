name: collect

# WEEK 1: manual trigger only, to check that collection works in CI and not
# just on the laptop.
#
# WEEK 2: uncomment the `schedule` block below. Offsetting to minute 17 is
# deliberate -- jobs scheduled on the hour land in a saturated queue at GitHub
# and start late.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "17 5 * * *"

# One collection at a time. Two concurrent runs would write the same file.
concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # No dependency install: the collector only uses the standard library.
      - name: Collect
        run: python -m collector --output-dir data

      # TODO week 2: publish the result (commit to a data branch, upload as an
      # artifact, or GitHub Pages). Decide in docs/DECISIONS.md before writing
      # this step.
      - name: Summary
        run: ls -lh data/
